[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmad-automation"
version = "0.1.0"
description = "BMAD implementation phase automation using Google ADK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.1.45",
    "google-adk>=1.20.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
bmad-auto = "bmad_automation.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bmad_automation"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.8",
]
