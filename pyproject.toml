[project]
name = "bmad-auto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Peerapon Wechsuwanmanee", email = "peerapon.w@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.12.0",
    "claude-agent-sdk>=0.1.18",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "structlog>=25.5.0",
    "typer>=0.21.0",
]

[project.scripts]
bmad-auto = "bmad_auto:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]
